name: Fetch Articles

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-articles-main
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Article Fetch Script
        id: fetch
        continue-on-error: true
        env:
          SPIDERUM_SOURCE_URLS: https://spiderum.com/nguoi-dung/spiderum,https://spiderum.com/danh-muc/khoa-hoc-cong-nghe,https://spiderum.com/danh-muc/quan-diem-tranh-luan,https://spiderum.com/danh-muc/life-style
          SPIDERUM_MAX_ARTICLES: 28
          TXNAM_SOURCE_URL: https://txnam.net
          TXNAM_MAX_ARTICLES: 10
          TOTAL_ARTICLE_LIMIT: 100
          FETCH_RETRY_ATTEMPTS: 3
          FETCH_TIMEOUT_MS: 25000
        run: node scripts/fetch-spiderum.cjs

      - name: Commit and Push changes
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add public/data/articles.json public/data/articles public/data/fetch-status.json
          if git diff --cached --quiet; then
            echo "No article changes to commit."
          else
            git commit -m "Auto-update: Fetch articles"
            git pull --rebase origin main
            git push
          fi

      - name: Fail workflow if article fetch failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
