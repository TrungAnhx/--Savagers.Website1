name: Fetch Articles

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run Article Fetch Script
        env:
          SPIDERUM_SOURCE_URLS: https://spiderum.com/nguoi-dung/spiderum,https://spiderum.com/danh-muc/khoa-hoc-cong-nghe,https://spiderum.com/danh-muc/quan-diem-tranh-luan,https://spiderum.com/danh-muc/life-style
          SPIDERUM_MAX_ARTICLES: 28
          TXNAM_SOURCE_URL: https://txnam.net
          TXNAM_MAX_ARTICLES: 10
          TOTAL_ARTICLE_LIMIT: 100
        run: node scripts/fetch-spiderum.cjs

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add public/data/articles.json
          git commit -m "Auto-update: Fetch articles" || echo "No changes to commit"
          git push
